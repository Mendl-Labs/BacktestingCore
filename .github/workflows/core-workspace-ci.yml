# CI for the MAIN Cargo workspace (backtest, genetic, strategy, metrics, orderbook, dataloader, walkforward,
# data_prep, derivatives, greeks, signal, smartrouter, portfoliomanager, quant-diagnostics, riskmanager, config).
#
# This is a DIFFERENT set of crates from core-ci.yml, which only covers the standalone pure crates (weightsim,
# reference-rules, weightsim-rules, portfolio-construct, portfolio-eval) that are excluded from this workspace.
# core-ci.yml's own comment says the main workspace was left out because it "depends on private sibling repos
# (LoggingEngine) that a hosted runner cannot fetch without a token" -- that was true once, but LoggingEngine has
# since been open-sourced (confirmed 2026-09-30: `git ls-remote https://github.com/Nwagbara-Group-LLC/LoggingEngine`
# succeeds anonymously, no credentials needed). The only other git dependency, `databaseschema`, is `optional = true`
# behind the `postgres` feature and is also public, so it's never fetched by the jobs below either. No secrets or
# tokens are required for this workflow.
#
# Two jobs because ~40% of this workspace's open PRs at the time this was written (feat/etc. touching
# backtest/src/python_validation.rs, backtest/src/python_simulation.rs, strategy/src/strategies/python_strategy.rs)
# are gated behind the `python` feature (PyO3) and would get ZERO signal from a default-features-only job.
#
# Resolving the `ultra-logger` git dependency's exact locked commit on this runner's cold cache fails with
# "revision ... not found" -- confirmed NOT specific to any one commit (reproduced identically across two
# different, unrelated LoggingEngine commits) and NOT fixed by `net.git-fetch-with-cli = true` (already set
# repo-wide in `.cargo/config.toml` for an unrelated reason -- confirmed via the failing run's own log that Cargo
# issues the exact same low-level `git fetch ... +SHA:refs/commit/SHA` request either way; this is inherent to how
# Cargo resolves an exact locked commit for a git+tag dependency, not a choice between its two git backends). The
# underlying error, one line above the generic wrapper: `fatal: could not read Username for 'https://github.com':
# No such device or address` -- an auth challenge with nowhere to answer it in a non-interactive shell, for a
# request shape (fetch one specific non-tip-guaranteed commit object) that a normal ref-based fetch never
# triggers (the same job's plain tag-based checkout of the public `databaseschema` repo works fine).
#
# Rather than keep fighting that fetch, both jobs below check out LoggingEngine as an ordinary directory (the same
# `actions/checkout` most of this workflow already uses, no special negotiation) and `[patch]` the git dependency
# to that local path, bypassing Cargo's git-fetching for this one crate entirely. The patch is written at run time
# into `.cargo/config.toml`, never committed -- local dev keeps depending on the real git+tag reference.
name: core-workspace-ci

on:
  push:
    branches: [local-dev]
  pull_request:
    branches: [local-dev]

jobs:
  test:
    name: Test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `ref: main` skips actions/checkout's own default-branch auto-detection, which is what actually 404s here:
      # that step calls the GitHub API authenticated with THIS repo's GITHUB_TOKEN even for a cross-org checkout,
      # and that token has no visibility into Nwagbara-Group-LLC's repos (a different org than Mendl-Labs).
      # (`token: ''` looked like the fix but actions/checkout v4 rejects an empty string as "Input required and
      # not supplied" -- it wants the input omitted entirely, and omitting it re-triggers the same default-token
      # auto-detection call this is trying to avoid). With the ref given explicitly, checkout goes straight to
      # cloning that ref via plain git, which needs no auth at all for a public repo.
      - name: Check out LoggingEngine locally and patch ultra-logger to it
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          ref: main
          path: logging-engine-checkout
      - run: |
          cat >> .cargo/config.toml <<EOF
          [patch."https://github.com/Nwagbara-Group-LLC/LoggingEngine"]
          ultra-logger = { path = "${{ github.workspace }}/logging-engine-checkout/ultra-logger" }
          EOF
      - run: cargo test --workspace --lib

  test-python:
    name: Test (python feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `ref: main` skips actions/checkout's own default-branch auto-detection, which is what actually 404s here:
      # that step calls the GitHub API authenticated with THIS repo's GITHUB_TOKEN even for a cross-org checkout,
      # and that token has no visibility into Nwagbara-Group-LLC's repos (a different org than Mendl-Labs).
      # (`token: ''` looked like the fix but actions/checkout v4 rejects an empty string as "Input required and
      # not supplied" -- it wants the input omitted entirely, and omitting it re-triggers the same default-token
      # auto-detection call this is trying to avoid). With the ref given explicitly, checkout goes straight to
      # cloning that ref via plain git, which needs no auth at all for a public repo.
      - name: Check out LoggingEngine locally and patch ultra-logger to it
        uses: actions/checkout@v4
        with:
          repository: Nwagbara-Group-LLC/LoggingEngine
          ref: main
          path: logging-engine-checkout
      - run: |
          cat >> .cargo/config.toml <<EOF
          [patch."https://github.com/Nwagbara-Group-LLC/LoggingEngine"]
          ultra-logger = { path = "${{ github.workspace }}/logging-engine-checkout/ultra-logger" }
          EOF
      # Mirrors BacktestingEngine's own ci-cd.yml pattern (Install numpy/pandas for PyO3 tests) -- the verification
      # import fails this step loudly instead of letting a broken install surface later as an unrelated failure.
      - name: Install numpy/pandas for PyO3 tests
        run: |
          sudo python3 -m pip install --no-cache-dir --break-system-packages numpy pandas
          python3 -c "import numpy, pandas" || (echo "::error::numpy/pandas import failed after install" && exit 1)
      - run: cargo test --workspace --features backtest/python --lib
