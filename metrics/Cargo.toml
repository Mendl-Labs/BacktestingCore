[package]
name = "metrics"
version = "0.1.0"
edition = "2021"

[features]
default = []
persistence = ["diesel", "diesel-async", "uuid", "bigdecimal", "databaseschema"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Logging
ultra-logger = { git = "https://github.com/Nwagbara-Group-LLC/LoggingEngine", tag = "v0.1.0" }
once_cell = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
config = { path = "../config" }

# Database persistence dependencies (optional)
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "r2d2", "numeric", "64-column-tables", "serde_json"], optional = true }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"], optional = true }
uuid = { version = "1.0", features = ["v4", "serde"], optional = true }
bigdecimal = { version = "0.4", features = ["serde"], optional = true }
databaseschema = { git = "https://github.com/Nwagbara-Group-LLC/databaseschema", tag = "v0.1.1", optional = true }

[dev-dependencies]
proptest = "1"
rand = "0.8"
rand_distr = "0.4"
