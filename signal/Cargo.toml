[package]
name = "signal"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
derivatives = { path = "../derivatives" }

[dev-dependencies]
serde_json = "1.0"
criterion = "0.5"

[[bench]]
name = "signal_benchmark"
harness = false
