[package]
name = "portfoliomanager"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["orderbook/postgres"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
orderbook = { path = "../orderbook" }
derivatives = { path = "../derivatives" }
greeks = { path = "../greeks" }

# Logging
ultra-logger = { git = "https://github.com/Nwagbara-Group-LLC/LoggingEngine", tag = "v0.1.0" }
once_cell = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
serde_json = "1.0"
criterion = "0.5"

[[bench]]
name = "portfoliomanager_benchmark"
harness = false
