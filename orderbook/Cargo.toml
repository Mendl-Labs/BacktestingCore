[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["databaseschema", "dataloader/postgres", "dep:deadpool"]

[dependencies]
signal = { path = "../signal" }
config = { path = "../config" }
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

# Data structures and serialization
serde = { version = "1.0", features = ["derive", "rc"] }
chrono = { version = "0.4", features = ["serde"] }

# Collections and ordering
ordered-float = { version = "4.0", features = ["serde"] }
indexmap = { version = "2.0", features = ["serde"] }

# Integration with existing modules (optional for database features)
databaseschema = { path = "../../databaseschema", optional = true }
dataloader = { path = "../dataloader" }

# Database connection pooling (for tests)
deadpool = { version = "0.12", optional = true }

# Logging and metrics
# Logging
ultra-logger = { path = "../../LoggingEngine/ultra-logger" }
once_cell = "1.0"
serde_json = "1.0.143"

[dev-dependencies]
tokio-test = "0.4"
diesel-async = { version = "0.5", features = ["postgres", "deadpool"] }
