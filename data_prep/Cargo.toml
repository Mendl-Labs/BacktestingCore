[package]
name = "data_prep"
version = "0.1.0"
edition = "2021"
description = "Data preparation service for backtesting - converts historical data to optimized binary format"

[features]
default = []
postgres = ["diesel", "diesel-async", "databaseschema", "dataloader/postgres"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Database (optional)
diesel = { version = "2.2", features = ["postgres", "chrono", "numeric", "uuid"], optional = true }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"], optional = true }
databaseschema = { git = "https://github.com/Nwagbara-Group-LLC/databaseschema", tag = "v0.1.0", optional = true }

# Compression
lz4_flex = "0.11"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
ultra-logger = { git = "https://github.com/Nwagbara-Group-LLC/LoggingEngine", tag = "v0.1.0" }
once_cell = "1.19"
memmap2 = "0.9"
bigdecimal = { version = "0.4", features = ["serde"] }

# Shared types
dataloader = { path = "../dataloader" }

[dev-dependencies]
tempfile = "3.10"
