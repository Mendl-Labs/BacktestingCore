# Strategy Export Configuration for Kubernetes ConfigMap
# This configuration drives the strategy export system behavior

# Performance evaluation thresholds
performance_thresholds:
  # Base thresholds (can be overridden per environment)
  min_sharpe_ratio: 1.5          # Minimum risk-adjusted return
  min_profit_factor: 1.3         # Minimum profit/loss ratio  
  min_win_rate: 0.55             # Minimum win percentage (0.0-1.0)
  max_drawdown: 0.15             # Maximum portfolio decline (0.0-1.0)
  min_trades: 100                # Minimum sample size
  min_net_profit: 10000.0        # Minimum absolute profit ($)
  max_avg_trade_duration: 24.0   # Maximum hours per trade
  min_volatility_adjusted_return: 0.8  # Return/volatility ratio
  min_calmar_ratio: 1.2          # Annual return/max drawdown
  require_positive_skew: true    # Require positive return distribution skew
  
  # Environment-specific overrides
  environment_overrides:
    development:
      min_sharpe_ratio: 1.0      # Relaxed for dev testing
      min_profit_factor: 1.1
      min_win_rate: 0.50
      min_trades: 50
      min_net_profit: 1000.0
    
    staging:
      min_sharpe_ratio: 1.3      # Moderate requirements
      min_profit_factor: 1.2
      min_win_rate: 0.52
      min_trades: 75
      min_net_profit: 5000.0
    
    production:
      min_sharpe_ratio: 2.0      # Strict production requirements
      min_profit_factor: 1.5
      min_win_rate: 0.60
      max_drawdown: 0.10
      min_trades: 200
      min_net_profit: 25000.0

# Deployment configuration
deployment:
  signal_engine_path: "/app/signal-engine"  # Can be overridden by env var
  
  # Environment configurations
  environments:
    development:
      path: "/app/signal-engine/strategies/development"
      enabled: true
      max_strategies: 10
      approval_required: false
    
    staging:
      path: "/app/signal-engine/strategies/staging"  
      enabled: true
      max_strategies: 5
      approval_required: true
    
    production:
      path: "/app/signal-engine/strategies/production"
      enabled: true
      max_strategies: 3
      approval_required: true
  
  # Auto-deployment settings
  auto_deployment:
    enabled: true
    target_environment: "development"  # Auto-deploy to dev first
    batch_size: 1                     # Deploy one at a time
    delay_between_deployments: 300    # 5 minutes between deployments

# Filesystem configuration  
filesystem:
  export_base_path: "/app/exports"
  strategy_source_path: "/app/backtesting-engine/strategy/src/strategies"
  backup_enabled: true
  backup_retention_days: 30

# Approval workflow configuration
approval:
  # Per-environment approval requirements
  environments:
    development:
      required_approvers: 0          # No approval needed
      allowed_roles: ["developer", "trader", "admin"]
      auto_approve_threshold: 75.0   # Auto-approve if score > 75%
      timeout_hours: 1
    
    staging:
      required_approvers: 1          # One approver required
      allowed_roles: ["senior_trader", "risk_manager", "admin"]
      auto_approve_threshold: 85.0   # Auto-approve if score > 85%
      timeout_hours: 24
    
    production:
      required_approvers: 2          # Two approvers required
      allowed_roles: ["risk_manager", "head_of_trading", "admin"]
      auto_approve_threshold: 95.0   # Auto-approve only for exceptional strategies
      timeout_hours: 72
  
  # Notification settings (sensitive values come from secrets)
  notifications:
    enabled: true
    email_recipients: 
      - "trading-team@company.com"
      - "risk-management@company.com"
    # slack_webhook loaded from K8s secret: SLACK_WEBHOOK_URL
    # teams_webhook loaded from K8s secret: TEAMS_WEBHOOK_URL
  
  # Audit configuration
  audit:
    enabled: true
    retention_days: 90
    include_performance_data: true
    include_parameters: true

# Risk management configuration
risk_management:
  # Global risk limits
  global_limits:
    max_total_exposure: 1000000.0      # $1M total exposure limit
    max_strategies_per_symbol: 3       # Max 3 strategies per symbol
    max_strategies_per_exchange: 10    # Max 10 strategies per exchange  
    emergency_stop_enabled: true      # Enable emergency stop functionality
  
  # Default per-strategy risk limits
  strategy_limits:
    max_position_size: 100000.0       # $100K max position per strategy
    max_order_size: 10000.0           # $10K max single order
    max_daily_loss: 5000.0            # $5K max daily loss
    max_leverage: 3.0                 # 3x max leverage
    position_concentration_limit: 0.2  # 20% of portfolio max
  
  # Environment-specific risk limits
  environment_limits:
    development:
      capital_allocation_limit: 50000.0   # $50K max for dev testing
      max_concurrent_strategies: 5
      testing_mode: true
    
    staging:
      capital_allocation_limit: 200000.0  # $200K max for staging
      max_concurrent_strategies: 3
      testing_mode: false
    
    production:
      capital_allocation_limit: 1000000.0 # $1M max for production
      max_concurrent_strategies: 3
      testing_mode: false
