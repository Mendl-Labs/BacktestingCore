[package]
name = "strategy"
version = "0.1.0"
edition = "2021"

[features]
default = []
python = ["pyo3"]
postgres = [
    "dataloader/postgres",
    "portfoliomanager/postgres",
    "riskmanager/postgres",
]

[dependencies]
signal = { path = "../signal" }
config = { path = "../config" }
derivatives = { path = "../derivatives" }
greeks = { path = "../greeks" }
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"

# Data structures and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# CLI support
clap = { version = "4.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
fastrand = "2.0"

# Math and statistics
statrs = "0.17"
ta = "0.5"  # Technical analysis library

# Collections
indexmap = { version = "2.0", features = ["serde"] }

# Integration with existing modules
dataloader = { path = "../dataloader" }

# Portfolio manager integration
portfoliomanager = { path = "../portfoliomanager" }

# Risk manager integration
riskmanager = { path = "../riskmanager" }

# Logging and metrics
ultra-logger = { git = "https://github.com/Nwagbara-Group-LLC/LoggingEngine", tag = "v0.1.0" }
once_cell = "1.0"

# Async utilities
futures = "0.3"

# For BigDecimal conversions
num-traits = "0.2"

# Python strategy bridge (optional)
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
approx = "0.5"  # For floating point comparisons in tests
criterion = "0.5"

[[bench]]
name = "strategy_benchmark"
harness = false
