[package]
name = "dataloader"
version = "0.1.0"
edition = "2021"

[features]
default = []
postgres = ["dep:diesel", "dep:diesel-async", "databaseschema", "dep:deadpool"]
parquet = ["dep:arrow", "dep:parquet"]

[dependencies]
config = { path = "../config" }
databaseschema = { git = "https://github.com/Nwagbara-Group-LLC/databaseschema", tag = "v0.1.1", optional = true }
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono", "numeric"], optional = true }
diesel-async = { version = "0.5", features = ["postgres", "deadpool"], optional = true }
deadpool = { version = "0.12", features = ["managed"], optional = true }
log = "0.4"
rand = { version = "0.8", features = ["std_rng"] }
tokio-retry = "0.3"
futures = "0.3"
fastrand = "2.0"
flate2 = "1.0"
async-trait = "0.1"
# CSV parsing for generic data loader
csv = "1.3"
# HTTP client for market data APIs
reqwest = { version = "0.11", features = ["json", "gzip"] }
urlencoding = "2.1"
# Logging
ultra-logger = { git = "https://github.com/Nwagbara-Group-LLC/LoggingEngine", tag = "v0.1.0" }
once_cell = "1.0"
# Optional: Parquet/Arrow for columnar data
arrow = { version = "53", optional = true, default-features = false, features = ["csv", "json"] }
parquet = { version = "53", optional = true, default-features = false, features = ["arrow"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "dataloader_benchmark"
harness = false
