[package]
name = "backtest"
version = "0.1.0"
edition = "2021"

[features]
default = []
python = ["strategy/python", "pyo3"]
postgres = ["dataloader/postgres", "strategy/postgres", "walkforward/postgres", "databaseschema"]
# End-to-end integration tests (data → GA → simulation → WF → result)
# Gate slow tests behind this feature: cargo test -p backtest --features integration
integration = []
# Enable verbose debug logging in hot paths (trades, fills, etc.)
# Only enable for debugging - impacts performance
debug_logging = []
# Enable momentum simulation debug output (momentum samples, threshold stats)
# Only enable for debugging - impacts performance significantly
debug_momentum = []

[dependencies]
# External dependencies
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
ordered-float = "4.2"
bincode = "1.3"
num_cpus = "1.16"

# Performance optimizations
rustc-hash = "1.1"
smallvec = "1.11"
uuid = { version = "1.0", features = ["v4"] }

# Internal workspace dependencies
config = { path = "../config" }
dataloader = { path = "../dataloader" }
data_prep = { path = "../data_prep" }
derivatives = { path = "../derivatives" }
orderbook = { path = "../orderbook" }
portfoliomanager = { path = "../portfoliomanager" }
riskmanager = { path = "../riskmanager" }
strategy = { path = "../strategy" }
signal = { path = "../signal" }
metrics = { path = "../metrics" }
genetic = { path = "../genetic" }
walkforward = { path = "../walkforward" }
smartrouter = { path = "../smartrouter" }
databaseschema = { git = "https://github.com/Nwagbara-Group-LLC/databaseschema", tag = "v0.1.1", optional = true }
quant-diagnostics = { path = "../quant-diagnostics" }
pyo3 = { version = "0.22", features = ["auto-initialize"], optional = true }

# Logging
ultra-logger = { git = "https://github.com/Nwagbara-Group-LLC/LoggingEngine", tag = "v0.1.0" }
once_cell = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
metrics = { path = "../metrics" }
