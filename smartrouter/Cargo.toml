[package]
name = "smartrouter"
version = "0.1.0"
edition = "2021"
description = "Smart Order Router for multi-venue order execution simulation in backtesting"

[dependencies]
# Workspace crates
orderbook = { path = "../orderbook" }
config = { path = "../config" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "router_benchmark"
harness = false
